name: kurdistan_iptv
description: "An IPTV application for Kurdish and international live channels."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # پکیجە سەرەکییەکانی media_kit بۆ لێدانی هەموو کەناڵێک بە بێ کێشە
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_safe_uri: ^0.1.2
  
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
